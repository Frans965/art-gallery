<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Artwork — ARTORA</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="upload">
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo">Art<span>ora</span></a>
      <nav>
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="gallery.html">Gallery</a></li>
          <li><a href="top.html">Top</a></li>
          <li><a href="add-artwork.html" class="active">Add Artwork</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="upload-page">
    <div class="container">
      <div class="upload-card">
        <h1>Add Artwork</h1>
        <p>Share your creative work with the community. A passcode is required to upload.</p>

        <div id="alert-box"></div>

        <form id="upload-form" enctype="multipart/form-data">
          <div class="form-group">
            <label for="title">Artwork Name *</label>
            <input type="text" id="title" name="title" required placeholder="Enter artwork title">
          </div>

          <div class="form-group">
            <label for="creatorName">Creator Name *</label>
            <input type="text" id="creatorName" name="creatorName" required placeholder="Your name or alias">
          </div>

          <div class="form-group">
            <label for="category">Category *</label>
            <select id="category" name="category" required>
              <option value="">Select a category</option>
              <option value="painting">Painting</option>
              <option value="digital">Digital Art</option>
              <option value="photography">Photography</option>
              <option value="sculpture">Sculpture</option>
              <option value="illustration">Illustration</option>
              <option value="mixed-media">Mixed Media</option>
              <option value="other">Other</option>
            </select>
          </div>

          <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" name="description" placeholder="Tell us about your artwork..."></textarea>
          </div>

          <div class="form-group">
            <label for="image">Image File *</label>
            <div class="image-preview-area">
              <div id="preview-placeholder" class="preview-placeholder">
                Select an image to preview
                <span>JPG, PNG, GIF — max 5 MB</span>
              </div>
              <div id="image-preview" class="image-preview-wrap" hidden>
                <img id="preview-img" class="preview-img" alt="Upload preview">
                <button type="button" id="remove-preview" class="remove-preview">Remove</button>
              </div>
            </div>
            <input type="file" id="image" name="image" accept="image/*" required style="margin-top: 0.75rem;">
          </div>

          <div class="form-group">
            <label for="passcode">Upload Passcode *</label>
            <input type="password" id="passcode" name="passcode" required placeholder="Enter upload passcode">
          </div>

          <div class="form-actions">
            <button type="submit" class="btn btn-primary">Upload Artwork</button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">&copy; 2026 ARTORA — Online Art Gallery &amp; Creative Showcase</div>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
